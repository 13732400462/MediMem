[project]
name = "mem-ehr-agent"
version = "0.1.0"
description = "Longitudinal EHR memory-enhanced multi-agent diagnosis benchmark scaffold."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
semantic = ["sentence-transformers>=3.0.0,<6.0.0"]

[project.scripts]
mem-ehr = "medimem.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

